name: AV CORE

on:
  push:
    paths:
      - "tools/av-core/**"
      - "test/telemetry/protocol/**"
      - ".github/workflows/av-core.yml"
  pull_request:
    paths:
      - "tools/av-core/**"
      - "test/telemetry/protocol/**"
      - ".github/workflows/av-core.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/av-core/backend/requirements-dev.txt
      - name: Backend dependencies
        run: python -m pip install -r tools/av-core/backend/requirements-dev.txt
      - name: Backend tests
        run: python -m unittest discover -s tools/av-core/tests/backend -p "test_*.py"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/av-core/frontend/package-lock.json
      - name: Frontend dependencies
        working-directory: tools/av-core/frontend
        run: npm ci
      - name: Frontend tests
        working-directory: tools/av-core/frontend
        run: npm test
      - name: Frontend build
        working-directory: tools/av-core/frontend
        run: npm run build

  firmware:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Firmware native tests
        working-directory: tools/av-core/firmware
        run: pio test -e native
      - name: WARN CTRL firmware build
        working-directory: tools/av-core/firmware
        run: pio run -e warn_ctrl
      - name: THREAT PROC firmware build
        working-directory: tools/av-core/firmware
        run: pio run -e threat_proc
