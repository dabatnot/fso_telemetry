name: Telemetry short product validation

on:
  pull_request:
    paths:
      - '.github/workflows/telemetry-protocol.yaml'
      - 'CMakeLists.txt'
      - 'code/CMakeLists.txt'
      - 'code/telemetry/**'
      - 'documentation/analysis/**'
      - 'test/src/CMakeLists.txt'
      - 'test/src/source_groups.cmake'
      - 'test/src/telemetry/**'
      - 'test/telemetry/**'
  push:
    branches: [master, 'codex/**']
    paths:
      - '.github/workflows/telemetry-protocol.yaml'
      - 'CMakeLists.txt'
      - 'code/CMakeLists.txt'
      - 'code/telemetry/**'
      - 'documentation/analysis/**'
      - 'test/src/CMakeLists.txt'
      - 'test/src/source_groups.cmake'
      - 'test/src/telemetry/**'
      - 'test/telemetry/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract_assets:
    name: Frozen wire assets and independent decoder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reject retired certification references
        run: python -B test/telemetry/tools/check_no_legacy_certification.py .
      - name: Verify frozen FSTL 1.0 bytes and hashes
        run: >-
          python -B test/telemetry/protocol/tools/verify_fstl_1_0_freeze.py
          --check --repo .
      - name: Exercise FSTL 1.0 mutation guards
        run: python -B test/telemetry/protocol/tools/test_fstl_1_0_freeze.py
      - name: Verify FSTL schemas and exact profile masks
        run: |
          python -B test/telemetry/protocol/tools/fstl_schema.py --self-test
          python -B test/telemetry/protocol/tools/verify_schema_vectors.py --check
          python -B test/telemetry/protocol/tools/verify_schema_vectors.py --check --schema test/telemetry/protocol/schema/fstl-v1.1.yaml
          python -B test/telemetry/protocol/tools/verify_fstl_1_1_amendment.py --check --repo .
      - name: Verify transport and business vectors
        run: |
          python -B test/telemetry/protocol/tools/generate_transport_vectors.py --check
          python -B test/telemetry/protocol/tools/generate_protocol_vectors.py --check
          python -B test/telemetry/protocol/tools/fstl_reference_decoder.py --check --repo .
          python -B test/telemetry/protocol/tools/verify_telemetry_assets.py --require-complete
      - name: Test the independent observation client
        run: python -B test/telemetry/protocol/tools/test_fstl_console_client_contract.py
      - name: Prepare the bounded fuzz corpus
        run: >-
          python -B test/telemetry/protocol/fuzz/prepare_fuzz_corpus.py
          --vectors test/telemetry/protocol/vectors
          --output telemetry-fuzz-corpus
      - uses: actions/upload-artifact@v7
        with:
          name: telemetry-short-corpus
          path: telemetry-fuzz-corpus/manifest.json

  telemetry_short_linux:
    name: Release product path and loopback (x64 Linux)
    runs-on: ubuntu-latest
    container: ghcr.io/scp-fs2open/linux_build:sha-ab87451
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Set workspace as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure Release tests
        run: >-
          cmake -S . -B build-telemetry-short -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFSO_BUILD_TESTS=ON
          -DFSO_BUILD_QTFRED=OFF
          -DFSO_BUILD_FRED2=OFF
          -DFSO_USE_SPEECH=OFF
          -DFSO_USE_VOICEREC=OFF
          -DFSO_BUILD_WITH_FFMPEG=OFF
          -DFSO_BUILD_WITH_DISCORD=OFF
          -DFSO_BUILD_WITH_OPENGL=OFF
          -DFSO_BUILD_WITH_OPENXR=OFF
          -DFSO_BUILD_INCLUDED_LIBS=ON
          -DFSO_USE_LTO=OFF
          -DENABLE_COTIRE=OFF
      - name: Build short telemetry tests and product integration tests
        run: >-
          cmake --build build-telemetry-short --target
          unittests telemetry_phase2_unit_tests
          telemetry_phase2_protocol_tests telemetry_phase2_integration_tests
          telemetry_native_runtime_loopback_contract_tests
      - name: Run telemetry-short in under five minutes
        shell: bash
        run: |
          started=$SECONDS
          ctest --test-dir build-telemetry-short -C Release -L telemetry-short --output-on-failure --timeout 60
          elapsed=$((SECONDS - started))
          test "$elapsed" -lt 300
      - name: Document architecture scope
        run: echo "ARM is excluded from native loopback until an ARM runner is explicitly supported."

  telemetry_short_windows:
    name: Release product path and loopback (x64 Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Configure Release tests
        shell: pwsh
        run: >-
          cmake -S . -B build-telemetry-short -A x64
          -DFSO_BUILD_TESTS=ON
          -DFSO_BUILD_QTFRED=OFF
          -DFSO_BUILD_FRED2=OFF
          -DFSO_USE_SPEECH=OFF
          -DFSO_USE_VOICEREC=OFF
          -DFSO_BUILD_WITH_FFMPEG=OFF
          -DFSO_BUILD_WITH_DISCORD=OFF
          -DFSO_BUILD_WITH_OPENGL=OFF
          -DFSO_BUILD_WITH_OPENXR=OFF
          -DFSO_BUILD_INCLUDED_LIBS=ON
          -DFSO_USE_LTO=OFF
          -DENABLE_COTIRE=OFF
      - name: Build short telemetry tests with one compiler
        shell: pwsh
        run: >-
          cmake --build build-telemetry-short --config Release --target
          unittests telemetry_phase2_unit_tests
          telemetry_phase2_protocol_tests telemetry_phase2_integration_tests
          telemetry_native_runtime_loopback_contract_tests --
          /m:1 /p:CL_MPCount=1 /verbosity:minimal
      - name: Run telemetry-short in under five minutes
        shell: pwsh
        run: |
          $started = Get-Date
          ctest --test-dir build-telemetry-short -C Release -L telemetry-short --output-on-failure --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (((Get-Date) - $started).TotalSeconds -ge 300) {
            throw 'telemetry-short exceeded five minutes'
          }
  fuzz_smoke:
    name: Bounded fuzz smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            standalone: 'OFF'
          - os: macos-latest
            standalone: 'ON'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Install platform dependencies
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then sudo apt-get update && sudo apt-get install --yes libudev-dev ninja-build; fi
          if [ "${{ runner.os }}" = "macOS" ]; then brew install ninja; fi
      - name: Configure bounded fuzz targets
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-telemetry-fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DFSO_BUILD_TELEMETRY_FUZZERS=ON
          -DFSO_TELEMETRY_FUZZ_STANDALONE=${{ matrix.standalone }}
          -DFSO_BUILD_TESTS=OFF
          -DFSO_BUILD_QTFRED=OFF
          -DFSO_BUILD_FRED2=OFF
          -DFSO_BUILD_WITH_FFMPEG=OFF
          -DFSO_BUILD_WITH_OPENGL=OFF
          -DFSO_BUILD_INCLUDED_LIBS=ON
          -DFSO_USE_LTO=OFF
          -DENABLE_COTIRE=OFF
      - name: Build and run the short corpus
        run: cmake --build build-telemetry-fuzz --target telemetry_fuzz_smoke

  fuzz_smoke_windows:
    name: Bounded fuzz corpus replay (x64 Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Configure bounded replay targets
        shell: pwsh
        run: >-
          cmake -S . -B build-telemetry-fuzz -A x64
          -DFSO_BUILD_TELEMETRY_FUZZERS=ON
          -DFSO_TELEMETRY_FUZZ_STANDALONE=ON
          -DFSO_BUILD_TESTS=OFF
          -DFSO_BUILD_QTFRED=OFF
          -DFSO_BUILD_FRED2=OFF
          -DFSO_BUILD_WITH_FFMPEG=OFF
          -DFSO_BUILD_WITH_OPENGL=OFF
          -DFSO_BUILD_INCLUDED_LIBS=ON
          -DFSO_USE_LTO=OFF
          -DENABLE_COTIRE=OFF
      - name: Build and replay with one compiler
        shell: pwsh
        run: >-
          cmake --build build-telemetry-fuzz --config Release
          --target telemetry_fuzz_smoke --
          /m:1 /p:CL_MPCount=1 /verbosity:minimal
