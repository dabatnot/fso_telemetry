        "properties": "est une donnée de simulation. Elle peut rester constante en pause, progresser selon la compression temporelle et être réinitialisée lors d'un changement de mission. Elle ne sert ni à ordonner les datagrammes, ni aux timeouts, ni à la synchronisation."
      },
      "process_monotonic": {
        "fields": [
          "sent_time_us",
          "producer_sample_time_us"
        ],
        "properties": [
          "elle ne représente pas une heure civile ;",
          "elle continue pendant la pause de mission ;",
          "elle ne recule pas dans la durée du processus ;",
          "son origine n'est pas comparable directement à celle du pair."
